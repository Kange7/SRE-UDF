general {
    base_exp_dir = ./outs/
    recording = [
        ./,
        ./models
    ]
}

dataset {
    data_dir = data/swer3d/
}

train {
    learning_rate = 0.001
    step1_maxiter = 40000
    step2_maxiter = 80000
    maxiter       = 80000          
    warm_up_end = 1000
    eval_num_points = 1000000
    df_filter = 0.01
    far = 0.01
    outlier = 0.002
    extra_points_rate = 2
    low_range = 1.1

    batch_size = 5000
    batch_size_step2 = 20000

    save_freq = 5000
    val_freq = 2500
    val_mesh_freq = 2500
    report_freq = 5000

    igr_weight = 0.1
    mask_weight = 0.0

    snn_sparsity_weight = 0.001
    snn_output_sparsity_weight = 0.0005
    snn_target_rate = 0.00001
    load_ckpt = none
}

model {
    udf_network {
        d_in = 3
        d_out = 1
        d_hidden = 384
        n_layers = 10
        skip_in = [5]
        multires = 0
        scale = 1
        geometric_init = true
        weight_norm = true
        inside_outside = false

        # SNN 
        use_snn = true
        snn_num_steps = 4
        snn_beta = 0.9
        snn_threshold = 0.5
        snn_surrogate_slope = 25
        snn_output_layers = 2
    }
}